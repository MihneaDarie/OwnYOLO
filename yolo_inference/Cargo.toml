[package]
name = "yolo_inference"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
ndarray = { version = "0.17.1", features = ["rayon"] }
rayon = "1.10"
rand = "0.8"
ndarray-npy = "0.10.0"
opencv = "0.97.2"
base64 = "0.22.1"
saker-rs = "0.1.0"
onnx_graph = "0.1.1"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[lints]
workspace = true
